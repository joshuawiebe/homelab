# Configuration for the always-on Pi 5: LAN services + the snapshot repository.
#
#   sudo ln -s /opt/homelab/hosts/pi/homelab.toml /etc/homelab/homelab.toml
#   export HOMELAB_CONF=/etc/homelab/homelab.toml
#   homelab doctor && homelab up

[general]
services_dir = "hosts/pi/services"
data_dir = "/srv/homelab"
# No reverse proxy here: these services are LAN-only on purpose.

[provision.pi]
# by-id paths, never /dev/sdX. Both must be empty and unmounted.
# `sudo homelab config` lists the candidate disks on this host and writes them here, so this
# file stays generic in git. `homelab doctor` warns until it is filled in.
devices = []
md_device = "/dev/md/repo"
vg = "vg_repo"
lv = "lv_repo"
mount = "/srv/repo"
label = "homelab-repo"

[snapshot]
tool = "restic"
repo = "/srv/repo/restic"
password_file = "/etc/homelab/restic.password"
# staging mount of the NUC pulled over ssh, plus the Pi's own data: AdGuard, Kuma and Gotify
# live here, and a snapshot that only covers the NUC would quietly skip them.
source = ["/srv/mnt/nuc/srv/homelab", "/srv/homelab"]
exclude = ["**/cache", "**/*.tmp", "**/logs", "**/.cache"]
keep_daily = 7
keep_weekly = 4
keep_monthly = 6
check_subset = "5%"
schedule = "*-*-* 02:30:00"
copy = true
healthcheck_url = ""
gotify_url = "http://127.0.0.1:8080"
gotify_token = ""

# Run on the NUC with: homelab snapshot run --remote backup@homelab.lan
# Consistent database dumps beat copying live files, and they must land inside data_dir:
# a dump written to /srv/dumps sits next to the snapshot, not in it, and is never backed up.
pre = [
  "mkdir -p /srv/homelab/dumps && docker exec db sh -c 'exec mysqldump --single-transaction --quick --all-databases' > /srv/homelab/dumps/nextcloud.sql",
  "mkdir -p /srv/homelab/dumps && sqlite3 /srv/homelab/vw-data/db.sqlite3 '.backup /srv/homelab/dumps/vaultwarden.sqlite'",
]

# The Pi's own databases: same layout, but they live here, so they are never dumped over ssh.
pre_local = [
  "mkdir -p /srv/homelab/dumps && sqlite3 /srv/homelab/uptime_kuma/kuma.db '.backup /srv/homelab/dumps/kuma.sqlite'",
  "mkdir -p /srv/homelab/dumps && sqlite3 /srv/homelab/gotify/gotify.db '.backup /srv/homelab/dumps/gotify.sqlite'",
]

# Second local copy on the spinning disk: a bad prune cannot take both.
[[snapshot.copies]]
name = "cold"
repo = "/srv/cold/restic"
password_file = "/etc/homelab/restic-cold.password"
limit_upload = 0
keep_daily = 14
keep_weekly = 8
keep_monthly = 12

# Offsite. Fill in your Storage Box sub-account. Only the Pi knows this key.
[[snapshot.copies]]
name = "offsite"
repo = "sftp:u123456@u123456.your-storagebox.de:23//restic"
password_file = "/etc/homelab/restic-offsite.password"
limit_upload = 30000
keep_daily = 14
keep_weekly = 8
keep_monthly = 12
