# every container writes json-file logs; without a cap they grow until the disk is full
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  gotify:
    image: ${GOTIFY_IMAGE:-gotify/server:latest}
    logging: *default-logging
    container_name: gotify
    hostname: gotify
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-.}/data:/app/data
    environment:
      - TZ=Europe/Berlin
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.middlewares=security-headers@docker"
      - "traefik.http.routers.gotify.tls.certresolver=dns"
      - "traefik.http.routers.gotify.tls.domains[0].main=${DOMAIN}"

networks:
  proxy:
    external: true
