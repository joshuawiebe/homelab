# every container writes json-file logs; without a cap they grow until the disk is full
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:latest}
    logging: *default-logging
    container_name: vaultwarden
    hostname: vaultwarden
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DOMAIN=${DOMAIN}
    volumes:
      - ${DATA_DIR:-.}/vw-data:/data/
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.middlewares=security-headers@docker"
      - "traefik.http.routers.vaultwarden.tls.certresolver=dns"
      - "traefik.http.routers.vaultwarden.tls.domains[0].main=${DOMAIN}"

networks:
  proxy:
    external: true
