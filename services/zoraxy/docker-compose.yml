# every container writes json-file logs; without a cap they grow until the disk is full
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  zoraxy:
    image: ${ZORAXY_IMAGE:-zoraxydocker/zoraxy:latest}
    logging: *default-logging
    container_name: zoraxy
    hostname: zoraxy
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP (Zoraxy Reverse Proxy)
      - "443:443"     # HTTPS (Zoraxy Reverse Proxy)
      - "8000:8000"   # Zoraxy Admin UI
    volumes:
      - ./config/:/opt/zoraxy/config/
      - ./plugin/:/opt/zoraxy/plugin/
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime
    environment:
      FASTGEOIP: "true"
    networks:
      - proxy

networks:
  proxy:
    external: true
